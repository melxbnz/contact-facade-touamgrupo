<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RENOBAT | Reformas en Alicante</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      background: #f4f2ed;
      color: #181818;

      font-family: "DM Sans", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;

      background: #ffffff;

      padding: 48px 30px 32px;

      border-radius: 4px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08);
    }

    .brand {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;

      margin-bottom: 35px;

      font-weight: 600;
    }

    h1 {
      font-family: "Playfair Display", serif;

      font-size: 38px;
      line-height: 1.05;

      margin: 0 0 18px;
      font-weight: 500;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.6;

      color: #686868;

      margin-bottom: 36px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;

      padding: 18px 20px;

      margin-top: 12px;

      text-decoration: none;

      font-size: 15px;
      font-weight: 500;

      transition: 0.2s ease;
    }

    .button-primary {
      background: #181818;
      color: white;
    }

    .button-primary:hover {
      background: #333333;
      transform: translateY(-2px);
    }

    .button-secondary {
      background: white;
      color: #181818;

      border: 1px solid #181818;
    }

    .button-secondary:hover {
      background: #f4f2ed;
      transform: translateY(-2px);
    }

    .arrow {
      font-size: 20px;
    }

    .footer {
      margin-top: 34px;

      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: #999;
    }

    @media (max-width: 500px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 38px 22px 28px;
      }

      h1 {
        font-size: 33px;
      }

    }

  </style>
</head>

<body>

  <main class="card">

    <div class="brand">
      RENOBAT
    </div>

    <h1>
      Transformamos<br>
      tu espacio.
    </h1>

    <p class="subtitle">
      Reformas integrales en Alicante.
      Cuéntanos tu proyecto o descubre nuestros servicios.
    </p>


    <a
      class="button button-primary"
      href="https://wa.me/34602591949"
      target="_blank"
    >
      <span>Contactar por WhatsApp</span>
      <span class="arrow">→</span>
    </a>


    <a
      class="button button-secondary"
      href="https://renobatreformas.com/"
      target="_blank"
    >
      <span>Visitar nuestra web</span>
      <span class="arrow">→</span>
    </a>


    <div class="footer">
      Reformas · Alicante
    </div>

  </main>

</body>
</html>
